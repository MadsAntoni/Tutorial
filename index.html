<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vine & Terroir — Wine Grape Education</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --wine:    #7b2d42;
      --wine-dk: #541e2d;
      --gold:    #c9a84c;
      --cream:   #fdf6ec;
      --text:    #2c1a22;
      --muted:   #7a6570;
      --card-bg: #fff;
      --shadow:  0 2px 12px rgba(0,0,0,.10);
      --radius:  12px;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--wine-dk) 0%, var(--wine) 60%, #a34060 100%);
      color: #fff;
      padding: 48px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='28' fill='none' stroke='rgba(255,255,255,.05)' stroke-width='1'/%3E%3C/svg%3E") repeat;
      pointer-events: none;
    }
    header h1 { font-size: clamp(1.8rem, 5vw, 3rem); letter-spacing: .03em; }
    header h1 span { color: var(--gold); }
    header p  { margin-top: 10px; font-size: 1.05rem; opacity: .85; font-style: italic; }

    /* ── Controls ───────────────────────────────────────────────────────── */
    .controls {
      max-width: 1100px;
      margin: 32px auto 0;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    #search {
      flex: 1 1 220px;
      padding: 10px 16px;
      border: 2px solid #ddd;
      border-radius: 30px;
      font-size: .95rem;
      font-family: inherit;
      background: #fff;
      outline: none;
      transition: border-color .2s;
    }
    #search:focus { border-color: var(--wine); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-btn {
      padding: 8px 18px;
      border: 2px solid #ddd;
      border-radius: 30px;
      background: #fff;
      font-family: inherit;
      font-size: .88rem;
      cursor: pointer;
      color: var(--muted);
      transition: all .2s;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: var(--wine);
      background: var(--wine);
      color: #fff;
    }

    /* ── Grid ───────────────────────────────────────────────────────────── */
    .grid {
      max-width: 1100px;
      margin: 28px auto 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* ── Grape Card ─────────────────────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(0,0,0,.14);
    }

    .card-header {
      padding: 22px 22px 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .grape-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .card-title h2 { font-size: 1.15rem; }
    .card-title .alias { font-size: .82rem; color: var(--muted); font-style: italic; margin-top: 2px; }
    .type-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: .74rem;
      font-family: sans-serif;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .red   { background: #f5e0e5; color: #8b2040; }
    .white { background: #fdf5d6; color: #7a6010; }
    .rose  { background: #fce8ef; color: #c05070; }

    .card-notes {
      padding: 0 22px 16px;
      font-size: .88rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }

    .taste-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 22px 18px;
    }
    .pill {
      padding: 3px 11px;
      border-radius: 20px;
      font-size: .78rem;
      font-family: sans-serif;
      background: #f0eae8;
      color: var(--text);
    }

    .card-footer {
      border-top: 1px solid #f0e8e8;
      padding: 12px 22px;
      font-size: .8rem;
      color: var(--muted);
      font-family: sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-footer svg { flex-shrink: 0; }

    /* ── Modal ──────────────────────────────────────────────────────────── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30,10,15,.55);
      z-index: 100;
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.open { display: flex; }

    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      position: relative;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .modal-close {
      position: sticky;
      top: 0;
      float: right;
      margin: 16px 16px 0 0;
      width: 32px; height: 32px;
      border: none;
      background: #f0e8e8;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background .2s;
    }
    .modal-close:hover { background: #e0d0d4; }

    .modal-hero {
      padding: 32px 32px 0;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .modal-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      flex-shrink: 0;
    }
    .modal-title h2 { font-size: 1.65rem; }
    .modal-title .alias { color: var(--muted); font-style: italic; margin-top: 4px; }
    .modal-title .type-badge { margin-top: 8px; }

    .modal-body { padding: 24px 32px 32px; }

    .modal-section { margin-bottom: 28px; }
    .modal-section h3 {
      font-size: .8rem;
      font-family: sans-serif;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--wine);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #f0e0e5;
    }
    .modal-section p { line-height: 1.7; font-size: .95rem; color: #3a2530; }

    /* Tasting wheel */
    .flavor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .flavor-item {
      background: #fdf3f5;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .87rem;
    }
    .flavor-item .icon { font-size: 1.2rem; }

    /* Regions */
    .region-list { display: flex; flex-direction: column; gap: 14px; }
    .region-card {
      border: 1px solid #eedde2;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .region-card .region-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: .95rem;
      margin-bottom: 6px;
    }
    .region-card .region-name .flag { font-size: 1.2rem; }
    .region-card .region-effect {
      font-size: .88rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .region-card .region-notes {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .region-card .pill { background: #f5ece0; }

    /* No results */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>

<header>
  <h1>Vine <span>&</span> Terroir</h1>
  <p>Discover wine grapes, their tasting notes, and how the world shapes their flavour</p>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="Search grapes…" aria-label="Search grapes" />
  <div class="filters" role="group" aria-label="Filter by type">

    <button class="filter-btn" data-filter="red">Red</button>

  </div>
</div>

<main class="grid" id="grape-grid" aria-label="Grape varieties"></main>

<!-- Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-grape-name">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

// ── Render cards ─────────────────────────────────────────────────────────────
function renderCards(grapes) {
  const grid = document.getElementById('grape-grid');
  grid.innerHTML = '';

  if (!grapes.length) {
    grid.innerHTML = '<p class="no-results">No grapes found. Try a different search or filter.</p>';
    return;
  }

  grapes.forEach(grape => {
    const card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Learn about ${grape.name}`);

    const topRegions = grape.regions.slice(0, 3).map(r => `${r.flag} ${r.name.split(',')[0]}`).join(' · ');

    card.innerHTML = `
      <div class="card-header">
        <div class="grape-icon" style="background:${grape.bgLight};">${grape.icon}</div>
        <div class="card-title">
          <h2>${grape.name}</h2>
          <div class="alias">${grape.alias}</div>
          <span class="type-badge ${grape.type}">${grape.type === 'red' ? 'Red Wine' : grape.type === 'white' ? 'White Wine' : 'Rosé'}</span>
        </div>
      </div>
      <p class="card-notes">${grape.summary}</p>
      <div class="taste-pills">
        ${grape.flavors.map(f => `<span class="pill">${f.icon} ${f.label}</span>`).join('')}
      </div>
      <div class="card-footer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        ${topRegions}
      </div>
    `;

    card.addEventListener('click', () => openModal(grape));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(grape); });
    grid.appendChild(card);
  });
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(grape) {
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <div class="modal-hero">
      <div class="modal-icon" style="background:${grape.bgLight};">${grape.icon}</div>
      <div class="modal-title">
        <h2 id="modal-grape-name">${grape.name}</h2>
        <div class="alias">${grape.alias}</div>
        <span class="type-badge ${grape.type}">${grape.type === 'red' ? 'Red Wine' : grape.type === 'white' ? 'White Wine' : 'Rosé'}</span>
      </div>
    </div>
    <div class="modal-body">

      <div class="modal-section">
        <h3>About This Grape</h3>
        <p>${grape.summary}</p>
      </div>

      <div class="modal-section">
        <h3>Core Tasting Notes</h3>
        <div class="flavor-grid">
          ${grape.flavors.map(f => `
            <div class="flavor-item">
              <span class="icon">${f.icon}</span>
              <span>${f.label}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="modal-section">
        <h3>How Terroir Shapes the Taste</h3>
        <div class="region-list">
          ${grape.regions.map(r => `
            <div class="region-card">
              <div class="region-name">
                <span class="flag">${r.flag}</span>
                <span>${r.name}</span>
              </div>
              <p class="region-effect">${r.effect}</p>
              <div class="region-notes">
                ${r.notes.map(n => `<span class="pill">${n}</span>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      </div>

    </div>
  `;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal').scrollTop = 0;
  document.getElementById('modal-close').focus();
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── Filtering & search ────────────────────────────────────────────────────────
let activeFilter = 'all';
let searchTerm   = '';

function getFiltered() {
  return GRAPES.filter(g => {
    const matchesType   = activeFilter === 'all' || g.type === activeFilter;
    const matchesSearch = !searchTerm ||
      g.name.toLowerCase().includes(searchTerm) ||
      g.alias.toLowerCase().includes(searchTerm) ||
      g.flavors.some(f => f.label.toLowerCase().includes(searchTerm)) ||
      g.regions.some(r => r.name.toLowerCase().includes(searchTerm));
    return matchesType && matchesSearch;
  });
}

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  renderCards(getFiltered());
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderCards(getFiltered());
  });
});

// Initial render
renderCards(GRAPES);
</script>
</body>
</html>
